{% extends 'games/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold mb-6 text-green-400">Upload a New Game</h1>

    <div class="bg-gray-800 p-8 rounded-lg shadow-xl border border-gray-700">
        <form method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}

            {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-300 mb-1">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.help_text %}
                <p class="mt-1 text-sm text-gray-500">{{ field.help_text }}</p>
                {% endif %}
                {% if field.errors %}
                <div class="text-red-500 text-sm mt-1">
                    {{ field.errors }}
                </div>
                {% endif %}
            </div>
            {% endfor %}

            <div class="pt-4">
                <button type="submit" class="w-full px-6 py-3 bg-green-500 hover:bg-green-600 text-white rounded font-bold shadow transition">
                    Submit Game
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
